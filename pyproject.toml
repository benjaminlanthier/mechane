[project]
name = "mechane"            # placeholder name: check availability before publishing
version = "0.2.1"
description = "Managing Experiments, Configurations, Hashes And Numerical Executions."
requires-python = ">=3.13"
dependencies = ["click>=8.1", "numpy>=1.26"]

[project.scripts]
mechane = "mechane.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechane"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "ty>=0.0.85",
    "pre-commit",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", "tests"]
testpaths = ["tests"]
addopts = [
    "-n=1",
    "--cov-branch",
    "--cov=src",
    "--cov-report=term-missing",
    "--durations=10",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    'ignore:function ham\(\) is deprecated:DeprecationWarning',
]

[tool.ruff]
line-length = 100
target-version = "py313"
# The example project's packages are first-party too (ruff sorts their imports, ty resolves them).
src = [
    "src",
    "tests",
    "examples/radioactivity/src",
    "examples/radioactivity/experiments/src",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# Declarative class-level registries (`section_classes = {...}`) are intentional, not mutable defaults.
ignore = ["RUF012"]

[tool.ty.environment]
extra-paths = ["examples/radioactivity/src", "examples/radioactivity/experiments/src"]
