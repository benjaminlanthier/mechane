[project]
name = "mechane"            # placeholder name: check availability before publishing
version = "0.1.0"
description = "Managing Experiments, Configurations, Hashes And Numerical Executions."
requires-python = ">=3.13"
dependencies = ["click>=8.1", "numpy>=1.26"]

[project.scripts]
mechane = "mechane.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechane"]

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "ty>=0.0.85", "pre-commit"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
