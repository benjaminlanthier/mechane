# The numerical experiments: mechane laboratories built on the `radioactivity` package. Only this
# member depends on mechane. The workflow that runs the labs lives at the workspace root.
[project]
name = "radioactivity-experiments"
version = "0.1.0"
description = "The mechane laboratories of the radioactivity project."
requires-python = ">=3.13"
dependencies = ["radioactivity", "mechane"]

# Short names for the labs: params.py says LABORATORY = "decay" instead of a "module:Class" path.
[project.entry-points."mechane.laboratories"]
decay = "radioactivity_experiments.families.decay:DecayLab"
half_life = "radioactivity_experiments.families.half_life:HalfLifeLab"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radioactivity_experiments"]

[tool.uv.sources]
radioactivity = { workspace = true }
# This example uses the mechane of this repository, so that it always runs the code next to it.
# A real project pins a release instead:
#   mechane = { git = "https://github.com/benjaminlanthier/mechane", tag = "v0.2.0" }
mechane = { path = "../../..", editable = true }
