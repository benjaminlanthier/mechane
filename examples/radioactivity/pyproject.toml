# The research project's main package: the science, with no knowledge of mechane.
# This directory is also the root of a uv workspace: its `experiments` member holds the mechane
# laboratories, and the workflow that runs them (Snakefile, params.py, summarize.py) lives here.
[project]
name = "radioactivity"
version = "0.1.0"
description = "Monte Carlo radioactive decay: the science package of the mechane example."
requires-python = ">=3.13"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radioactivity"]

[tool.uv.workspace]
members = ["experiments"]

[dependency-groups]
dev = ["pytest>=8"]
# What the workflow needs on top of the science: the labs (and, through them, mechane) and
# Snakemake. `uv run --group workflow ...` installs them next to this package.
workflow = ["radioactivity-experiments", "snakemake>=9"]

[tool.uv.sources]
radioactivity-experiments = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
