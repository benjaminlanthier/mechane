name: Release

# Pushing a tag like v0.1.0 tests the code, builds it, and publishes a GitHub release.
# (Nothing is uploaded to PyPI: users install from the tag with `uv add ... --tag vX.Y.Z`.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Check that the tag matches the package version
        run: |
          VERSION="$(uv version --short)"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${VERSION} in pyproject.toml"
            exit 1
          fi

      - run: uv sync
      - run: uv run pytest -q
      - run: uv build

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes
